name: IL CI

# Build, test and scan every change to the base branch. Push a dev image for
# manual testing. ECR deletes images with the "dev-" prefix after 30 days.
on:
  pull_request:
    branches:
      - 1.6.1-base
  workflow_dispatch:

concurrency:
  group: il-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_ECR_ACCOUNT_ID: "491384846940"
  AWS_DEFAULT_REGION: eu-west-1
  ECR_REPOSITORY: apache-guacamole

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Set dev image tag
        id: tag
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            tag="dev-pr${PR_NUMBER}-${HEAD_SHA:0:7}"
          else
            ref=$(echo "$REF_NAME" | tr -c '[:alnum:]\n' '-' | tr '[:upper:]' '[:lower:]')
            tag="dev-${ref:0:40}-${HEAD_SHA:0:7}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and verify
        id: build
        uses: ./.github/actions/il-build
        with:
          image: guacamole-client:ci

      # Fork pull requests get no OIDC token, so they build and test only.
      - name: Configure AWS credentials
        id: aws
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ECR_ACCOUNT_ID }}:role/ecr-user
          role-session-name: guacamole-client-ci

      - name: Login to Amazon ECR
        if: steps.aws.outcome == 'success'
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Push dev image
        if: steps.aws.outcome == 'success'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          image="${AWS_ECR_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPOSITORY}:${TAG}"
          docker tag guacamole-client:ci "$image"
          docker push "$image"
          {
            echo "### Dev image"
            echo ""
            echo "\`$image\`"
          } >> "$GITHUB_STEP_SUMMARY"
